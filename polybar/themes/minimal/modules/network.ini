[module/network]
type = custom/script
exec = LC_ALL=C nmcli --terse --fields TYPE,STATE device status 2>/dev/null | awk -F: '$2 ~ /^connected/ && ($1 == "wifi" || $1 == "ethernet") { if ($1 == "wifi") print "Wi-Fi"; else print "Wired"; found = 1; exit } END { if (!found) print "Offline" }'
interval = 5
exec-if = command -v nmcli >/dev/null 2>&1

format = <label>
format-padding = 1
format-prefix = %{T2}NET%{T-}
format-prefix-foreground = ${colors.fg-alt}
label = %{T2}%output%%{T-}
label-padding = 1
